name: Deploy static research site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage public Pages tree
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          source = Path.cwd()
          target = source / "_site"
          if target.exists():
              shutil.rmtree(target)
          excluded_dirs = {".git", ".github", "__pycache__"}
          excluded_files = {"PROJECT_AUDIT.md", "RELEASE_CHECKLIST.md", "SCIENTIFIC_REVIEW.md", "PRE_DEPLOYMENT_TEST_REPORT.md", "qcd-code-archive.zip"}
          excluded_suffixes = {".map", ".pyc"}
          for path in source.rglob("*"):
              relative = path.relative_to(source)
              if path == target or target in path.parents or any(part in excluded_dirs for part in relative.parts):
                  continue
              if path.is_file() and (path.name in excluded_files or path.suffix in excluded_suffixes):
                  continue
              destination = target / relative
              if path.is_dir():
                  destination.mkdir(parents=True, exist_ok=True)
              else:
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(path, destination)
          print("Staged public Pages tree:", sum(1 for p in target.rglob("*") if p.is_file()), "files")
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
