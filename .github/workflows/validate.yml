name: Validate static research site

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Ubuntu LAPACKE
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y liblapacke-dev
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run eta_c tests
        run: python -B -m unittest discover -s code/eta_c/tests
      - name: Run jpsi tests
        run: python -B -m unittest discover -s code/jpsi/tests
      - name: Check local links and resource case
        run: python -B .github/validate_links.py
      - name: Parse results and embedded lab data
        run: |
          python - <<'PY'
          import glob
          import json
          for path in glob.glob("code/results/*.json"):
              json.load(open(path, encoding="utf-8"))
          text = open("code/lab-data.js", encoding="utf-8").read()
          json.loads(text.split("=", 1)[1].strip().rstrip(";"))
          print("OK: result JSON and lab-data.js parse")
          PY
      - name: Validate claims
        run: python -B code/validate_claims.py
      - name: Reject old URL placeholder
        run: |
          python - <<'PY'
          from pathlib import Path
          bad = "https://" + "<SITE_URL>"
          for path in Path(".").rglob("*"):
              if path.is_file() and ".git" not in path.parts and bad in path.read_text(encoding="utf-8", errors="ignore"):
                  raise SystemExit(f"forbidden legacy placeholder: {path}")
          print("OK: no legacy URL placeholder")
          PY
      - name: Enforce deployment size budget
        run: |
          python - <<'PY'
          from pathlib import Path
          total = sum(path.stat().st_size for path in Path(".").rglob("*") if path.is_file() and ".git" not in path.parts)
          print(f"deployment bytes: {total}")
          assert total <= 25 * 1024 * 1024, "deployment exceeds 25 MiB"
          PY
